name: Build EXE Windows

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Compiler l'exécutable
        run: |
          pyinstaller --onefile --windowed --name DetectionPortUSB detection_port_usb.py

      - name: Publier l'exécutable
        uses: actions/upload-artifact@v4
        with:
          name: DetectionPortUSB-exe
          path: dist/DetectionPortUSB.exe
